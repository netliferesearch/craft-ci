# Copy to .github/workflows/verify.yml in the site repo. Settings come from .netlife/fleet.json.
# Craft Cloud variant: also passes the asset secrets that Craft Cloud sites need.
# The secret lines pass names only; the values live in each repo's own secrets.
name: Verify
on: [pull_request]
jobs:
  verify:
    uses: netliferesearch/craft-ci/.github/workflows/verify.yml@v1
    with:
      app-client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
    secrets:
      SNAPSHOT_READ_KEY: ${{ secrets.SNAPSHOT_READ_KEY }}
      SNAPSHOT_READ_SECRET: ${{ secrets.SNAPSHOT_READ_SECRET }}
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      RENOVATE_PUSH_TOKEN: ${{ secrets.RENOVATE_PUSH_TOKEN }}
      CRAFT_CLOUD_PROJECT_ID: ${{ secrets.CRAFT_CLOUD_PROJECT_ID }}
      CRAFT_CLOUD_ENVIRONMENT_ID: ${{ secrets.CRAFT_CLOUD_ENVIRONMENT_ID }}
      CRAFT_CLOUD_USE_ASSET_CDN: ${{ secrets.CRAFT_CLOUD_USE_ASSET_CDN }}
      CRAFT_CLOUD_SIGNING_KEY: ${{ secrets.CRAFT_CLOUD_SIGNING_KEY }}
