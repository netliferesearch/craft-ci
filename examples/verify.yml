# Copy to .github/workflows/verify.yml in the site repo. Set snapshot-key to the site's slug.
name: Verify
on: [pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: netliferesearch/craft-ci@v1
        with:
          snapshot-key: snapshots/CHANGE-ME/latest.sql.gz
          spaces-key: ${{ secrets.SPACES_KEY }}
          spaces-secret: ${{ secrets.SPACES_SECRET }}
